name: probe
on:
  push:
    branches: [probe-krem]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0 (Linux; Android 16; SM-A536B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Mobile Safari/537.36"
          site=www.dtek-krem.com.ua
          curl -s -c c.txt -b c.txt -A "$UA" -o p.html https://$site/ua/shutdowns
          python3 - <<'PY'
          import re,json
          s=open('p.html',encoding='utf-8',errors='ignore').read()
          i=s.index('DisconSchedule.streets')
          d,_=json.JSONDecoder().raw_decode(s[s.index('{',i):])
          print('cities',len(d),'streets',sum(len(v) for v in d.values()))
          print(list(d)[:15])
          for k in ['м. Бровари','м. Ірпінь','м. Бориспіль']: print(k, k in d, len(d.get(k,[])))
          for m in re.finditer(r'getHomeNum',s): print('JS:',s[max(0,m.start()-500):m.start()+300].replace('\n',' '))
          for m in re.finditer(r'<script[^>]+src="([^"]+)"',s): print('SRC',m.group(1))
          PY
          tok=$(grep -oE 'name="csrf-token" content="[^"]+"' p.html | sed 's/.*content="//;s/"$//')
          post(){ curl -s -c c.txt -b c.txt -A "$UA" -H "X-CSRF-Token: $tok" -H "X-Requested-With: XMLHttpRequest" "$@" https://$site/ua/ajax | head -c 900; echo; }
          echo "--- A city+street"
          post --data-urlencode method=getHomeNum --data-urlencode "data[0][name]=city" --data-urlencode "data[0][value]=м. Бровари" --data-urlencode "data[1][name]=street" --data-urlencode "data[1][value]=вул. Незалежності"
          echo "--- B street only"
          post --data-urlencode method=getHomeNum --data-urlencode "data[0][name]=street" --data-urlencode "data[0][value]=вул. Незалежності"
          echo "--- C city+street+updateFact"
          post --data-urlencode method=getHomeNum --data-urlencode "data[0][name]=city" --data-urlencode "data[0][value]=с. Тарасівка" --data-urlencode "data[1][name]=street" --data-urlencode "data[1][value]=вул. Шевченка" --data-urlencode "data[2][name]=updateFact" --data-urlencode "data[2][value]=23.11.2026 12:00"
