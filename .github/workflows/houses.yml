name: Kyiv houses list
# Раз на тиждень оновлює довідник будинків Києва в гілці data; збірка вкладає його в застосунок
on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Crawl
        run: |
          mkdir -p /tmp/out
          python3 .github/fetch-streets.py /tmp/out || true
          python3 .github/crawl-houses.py /tmp/out/houses-kyiv.json
      - name: Save to data branch
        run: |
          git config user.name odin9den
          git config user.email odin9den@users.noreply.github.com
          if git fetch -q origin data; then git checkout -B data FETCH_HEAD; else git checkout --orphan data; git rm -rfq .; fi
          cp /tmp/out/*.json .
          git add *.json
          git diff --cached --quiet || git commit -qm "houses-kyiv $(date -u +%F)"
          git push origin data
