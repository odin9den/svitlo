name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже є на раннері GitHub — лише доставляємо платформу 36.
      - name: Install SDK 36
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3

      # Ключ підпису з GitHub Secrets (необов'язково). Без нього — debug-ключ.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SVITLO_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.SVITLO_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # прибираємо випадкові пробіли й переноси, що могли потрапити при вставці
            printf %s "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/svitlo.jks" || true
            PW=$(printf %s "$STORE_PW" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')
            echo "### Ключ підпису" >> $GITHUB_STEP_SUMMARY
            echo "- розмір файлу ключа: $(wc -c < "$RUNNER_TEMP/svitlo.jks") байт (очікується ~4–5 тис.)" >> $GITHUB_STEP_SUMMARY
            echo "- довжина пароля: ${#PW} символів (очікується 24)" >> $GITHUB_STEP_SUMMARY
            if keytool -list -keystore "$RUNNER_TEMP/svitlo.jks" -storepass "$PW" > kt.txt 2>&1; then
              echo "- ключ відкривається паролем ✓ ($(grep -c PrivateKeyEntry kt.txt) ключ)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ⚠️ ключ НЕ відкривається: $(grep -iE 'error|exception' kt.txt | head -1 | sed 's/keytool error: //')" >> $GITHUB_STEP_SUMMARY
            fi
            echo "SVITLO_KEYSTORE=$RUNNER_TEMP/svitlo.jks" >> $GITHUB_ENV
          fi

      - name: Bundle DTEK street lists
        run: |
          mkdir -p app/src/main/assets /tmp/data
          # Запасні копії довідників і будинки Києва — з гілки data (щотижня оновлює houses.yml)
          git fetch -q --depth 1 origin data && git archive FETCH_HEAD | tar -x -C /tmp/data || true
          python3 .github/fetch-streets.py app/src/main/assets /tmp/data
          cp /tmp/data/houses-kyiv.json app/src/main/assets/ 2>/dev/null || true
          ls -la app/src/main/assets

      - name: Build
        env:
          SVITLO_STORE_PASSWORD: ${{ secrets.SVITLO_STORE_PASSWORD }}
          SVITLO_KEY_PASSWORD: ${{ secrets.SVITLO_KEY_PASSWORD }}
        run: |
          set -o pipefail
          export SVITLO_STORE_PASSWORD=$(printf %s "$SVITLO_STORE_PASSWORD" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')
          export SVITLO_KEY_PASSWORD=$(printf %s "$SVITLO_KEY_PASSWORD" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')
          gradle assembleRelease bundleRelease --no-daemon 2>&1 | tee build.log || {
            echo '### Build errors' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E '^e: |error:|What went wrong|^> |ERROR:|Caused by|password|Keystore|keystore' build.log | grep -v '^> Task'  | head -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Name APK
        run: |
          V=$(grep versionName app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "V=$V" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk svitlo.apk
          cp app/build/outputs/apk/release/app-release.apk svitlo-$V.apk
          cp app/build/outputs/bundle/release/app-release.aab svitlo-$V.aab
          if [ -z "$SVITLO_KEYSTORE" ]; then
            echo "⚠️ Секретів підпису немає — збірка підписана debug-ключем. Google Play такий AAB не прийме." >> $GITHUB_STEP_SUMMARY
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: apk-for-test
          path: svitlo.apk

      - uses: actions/upload-artifact@v5
        with:
          name: svitlo-${{ env.V }}
          path: |
            svitlo-${{ env.V }}.apk
            svitlo-${{ env.V }}.aab

      # Стале посилання: /releases/latest/download/svitlo.apk завжди веде на останню збірку
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V-${{ github.run_number }}" svitlo.apk "svitlo-$V.aab#svitlo-$V.aab (для Google Play)" \
            --title "Світло $V" --notes "Збірка ${GITHUB_SHA::7}" --latest

  # Перевірка на емуляторі Android 16: встановлює APK, робить скріншоти,
  # збирає збої й публікує результат у гілку ci-screenshots.
  ui-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: apk-for-test

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -timezone Europe/Kiev
          script: bash .github/ui-test.sh

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots && cd shots
          echo "Збірка ${GITHUB_SHA::7} · $(TZ=Europe/Kiev date '+%d.%m.%Y %H:%M')" > README.md
          git init -q && git checkout -q -b ci-screenshots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "UI test ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" ci-screenshots
          if [ -s crash.txt ]; then
            echo '### ⚠️ Застосунок упав на емуляторі' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY; head -40 crash.txt >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
